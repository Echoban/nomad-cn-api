# Render Blueprint - NomadCN 一键部署配置
# 使用方法：访问以下链接一键部署
# https://dashboard.render.com/blueprint/new?repo=https://github.com/Echoban/nomad-cn-api

databases:
  - name: nomadcn-db
    databaseName: nomadcn
    user: nomadcn
    ipAllowList: []

services:
  - type: web
    name: nomadcn-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/cities
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: nomadcn-db
          property: connectionString
      - key: JWT_KEY
        value: NomadCN_SecretKey_2026_VeryLongString_ForJWT_Auth_!@#$%^&*()
      - key: JWT_ISSUER
        value: NomadCN
      - key: JWT_AUDIENCE
        value: NomadCN
      - key: CORS_ALLOW_ALL
        value: "true"
